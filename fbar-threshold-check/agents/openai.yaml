interface:
  display_name: "FBAR Threshold Check"
  short_description: "Build FBAR threshold support evidence"
  default_prompt: "Use $fbar-threshold-check to check my 2025 foreign-account statements against the $10,000 FBAR threshold; start with one account and tell me exactly what you need."
dependencies:
  skills:
    - name: "statement-intake-preflight"
      required: true
      description: "Runs required shared PDF intake with --scope one-account and fingerprints exact statements before FBAR extraction."
    - name: "get-year-end-fx-rate"
      required: false
      description: "Creates retained year-end FX workpapers required for non-USD FBAR conversion."
