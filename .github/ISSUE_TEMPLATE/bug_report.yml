name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project. Do not paste, attach, or link raw statements, real account data, personal information, credentials, or private logs. Build the reproduction from wholly fictional data. Report security or privacy vulnerabilities through the private link in the issue chooser.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include or link raw statements, real financial or account data, personal information, credentials, or private repository content.
          required: true
        - label: I can demonstrate this problem with wholly synthetic or dependency-free input.
          required: true

  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - statement-intake-preflight
        - fbar-threshold-check
        - get-year-end-fx-rate
        - get-yearly-fx-rate
        - statements-to-interest
        - privacy-gate
        - workpaper-kit
        - skill-forge submodule integration
        - repository tooling or documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the package version, repository release, or commit identifier you tested.
      placeholder: vX.Y.Z or commit identifier
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest sequence that reproduces the issue. Use invented values and filenames. Do not attach financial documents.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include only relevant runtime and operating-system versions. Remove usernames, absolute home paths, secrets, and private metadata.
      placeholder: Python 3.11; operating system and version; relevant dependency versions
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Checks already run
      description: List self-tests, strict inspection, or other diagnostics and their result.
