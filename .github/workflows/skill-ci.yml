name: Skill CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PDF test dependencies
        run: python -m pip install --disable-pip-version-check --no-input pdfplumber reportlab pypdf

      - name: Run deterministic release checks
        run: bash scripts/release-check.sh
